<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Методичка NL2 — единый вход</title>
<style>
  :root {
    --bg: #0f172a; --panel: #16203a; --line: #24304d; --text: #e2e8f0;
    --muted: #8b98ad; --accent: #3b82f6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text); display: flex; flex-direction: column;
    font: 14px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .brand { font-weight: 700; font-size: 15px; margin-right: 6px; white-space: nowrap; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab {
    padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: #131c31; color: var(--text); cursor: pointer; font-size: 13px;
    font-weight: 600; white-space: nowrap;
  }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .spacer { flex: 1; }
  .link {
    padding: 7px 12px; border-radius: 8px; border: 1px dashed var(--line);
    color: var(--muted); text-decoration: none; font-size: 13px; white-space: nowrap;
  }
  .link:hover { color: var(--text); border-color: var(--accent); }
  .frame-wrap { flex: 1; min-height: 0; background: var(--bg); }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
  .hint { padding: 6px 14px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <div class="brand">♠️ Методичка NL2</div>
  <div class="tabs" id="tabs"></div>
  <div class="spacer"></div>
  <a class="link" href="../trainer/index.html" target="_blank">🃏 Тренажёр</a>
  <a class="link" href="../hub/index.html" target="_blank">🏆 Хаб</a>
</header>

<div class="frame-wrap"><iframe id="view" title="раздел"></iframe></div>
<div class="hint" id="hint"></div>

<script>
const SECTIONS = [
  { id: "analyzer",  title: "📊 Логи",        src: "../analyzer/index.html"  },
  { id: "checklist", title: "✅ Чек-лист",     src: "../checklist/index.html" },
  { id: "postfloptr", title: "🎯 Тренажёр постфлопа", src: "../postflop-trainer/index.html" },
  { id: "postflop",  title: "🌊 Постфлоп",     src: "../postflop/index.html"  },
  { id: "shpora",    title: "📝 Шпора",        src: "../shpora/index.html"    },
  { id: "combos",    title: "🧮 Комбинаторика", src: "../combos/index.html"   },
  { id: "math",      title: "📐 Эквити",       src: "../math/index.html"      },
  { id: "opponents", title: "👥 Оппоненты",    src: "../opponents/index.html" },
  { id: "charts",    title: "📖 Префлоп",      src: "../charts/index.html"    }
];

const KEY = "guideActiveSection";
const tabsEl = document.getElementById("tabs");
const view = document.getElementById("view");
const hint = document.getElementById("hint");

function open(id) {
  const s = SECTIONS.find(x => x.id === id) || SECTIONS[0];
  view.src = s.src;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.id === s.id));
  try { localStorage.setItem(KEY, s.id); } catch (e) {}
  hint.textContent = "Раздел: " + s.title.replace(/^\S+\s/, "") + " · файл " + s.src.replace("../", "");
}

SECTIONS.forEach(s => {
  const b = document.createElement("button");
  b.className = "tab";
  b.dataset.id = s.id;
  b.textContent = s.title;
  b.addEventListener("click", () => open(s.id));
  tabsEl.appendChild(b);
});

let start = SECTIONS[0].id;
try { start = localStorage.getItem(KEY) || start; } catch (e) {}
open(start);
</script>
</body>
</html>
