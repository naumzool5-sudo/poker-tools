<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2440">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Постфлоп-тренажёр</title>
<style>
  :root { --bg:#1b2440; --panel:#232e4d; --line:#33405f; --text:#e8edf7; --muted:#93a0bd;
          --accent:#3b82f6; --good:#10b981; --bad:#ef4444; --warn:#f59e0b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior-y: contain; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.55 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;
         padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  .wrap { max-width:780px; margin:0 auto; padding:14px 14px calc(90px + env(safe-area-inset-bottom)); }
  header { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  h1 { font-size:18px; margin:0; flex:1; }
  .sub { color:var(--muted); font-size:12px; margin-bottom:12px; }
  .chip { font-size:11px; padding:4px 9px; border-radius:999px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
  .chip.on { color:var(--good); border-color:#065f46; }
  .chip.off { color:var(--warn); border-color:#78350f; }
  button { font-family:inherit; }

  .table-wrap { position:relative; width:100%; aspect-ratio: 675/470; margin-bottom:12px; }
  .felt { position:absolute; left:9%; top:12%; width:82%; height:76%;
          background: radial-gradient(ellipse at center, #1a5c34 0%, #12401f 70%, #0d3319 100%);
          border:6px solid #2c3a56; border-radius:50%; box-shadow: inset 0 0 40px rgba(0,0,0,.55); }
  .seat { position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:4px; }
  .badge { min-width:42px; padding:4px 8px; border-radius:999px; border:1px solid var(--line);
           background:#1d2740; color:#c9d4ea; font-size:11px; font-weight:700; text-align:center; }
  .badge.hero { background:#1d4ed8; border-color:#3b82f6; color:#fff; }
  .badge.villain { background:#7f1d1d; border-color:#ef4444; color:#fecaca; }
  .dealer { position:absolute; width:17px; height:17px; border-radius:50%; background:#e5e7eb; color:#111;
            font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center; }

  .cards { display:flex; gap:5px; justify-content:center; margin-top:2px; }
  .card { width:40px; height:56px; border-radius:7px; background:#f8fafc; color:#0f172a;
          display:flex; flex-direction:column; align-items:center; justify-content:center;
          font-weight:800; font-size:16px; line-height:1; box-shadow:0 2px 6px rgba(0,0,0,.4); }
  .card.red { color:#dc2626; }
  .board { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; gap:7px; }
  .board .card { width:46px; height:64px; font-size:19px; }
  .pot { position:absolute; left:50%; top:calc(50% + 56px); transform:translateX(-50%);
         background:rgba(0,0,0,.45); border:1px solid var(--line); border-radius:999px;
         padding:3px 11px; font-size:11.5px; color:#cbd5e1; white-space:nowrap; }

  .card-panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .hist { background:#18213a; border:1px solid var(--line); border-radius:8px; padding:10px;
          font-size:13px; color:#cbd5e1; white-space:pre-line; margin-bottom:12px; }
  .opts { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:6px 0 12px; }
  .opt { padding:12px 10px; border-radius:10px; border:1px solid var(--line); background:#1b2440;
         color:var(--text); font-weight:600; cursor:pointer; font-size:14px; width:100%; }
  .opt:active { transform: scale(.985); }
  .opt.sel { background:var(--accent); border-color:var(--accent); color:#fff; }
  label { display:block; color:var(--muted); font-size:12px; margin:10px 0 4px; }
  input[type=text], input[type=password] { width:100%; padding:11px 12px; background:#18213a; color:var(--text);
        border:1px solid var(--line); border-radius:10px; font-size:16px; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  button.primary { padding:12px 18px; border-radius:10px; border:1px solid var(--accent);
                   background:var(--accent); color:#fff; font-weight:700; cursor:pointer; font-size:15px; flex:1; }
  button.plain { padding:12px 16px; border-radius:10px; border:1px solid var(--line);
                 background:#1b2440; color:var(--text); font-weight:600; cursor:pointer; font-size:14px; }
  .verdict { margin-top:14px; font-size:14px; }
  .ok { color:var(--good); } .no { color:var(--bad); } .mid { color:var(--warn); }
  .score { color:var(--muted); font-size:13px; }
  .tag { display:inline-block; padding:1px 8px; border-radius:99px; border:1px solid var(--line);
         font-size:11px; color:var(--muted); }
  .spot-row { text-align:left; width:100%; background:#18213a; border:1px solid var(--line);
              border-radius:9px; padding:8px 10px; color:var(--text); cursor:pointer; font-size:12.5px;
              display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .spot-row.current { background:#1d4ed8; border-color:#3b82f6; }
  .hidden { display:none !important; }


  .range-open { cursor: pointer; }
  .seat[data-pos]:hover .badge { border-color: #60a5fa; color: #bfdbfe; }
  .range-modal { position: fixed; inset: 0; background: rgba(9,13,25,.82); display: none;
                 align-items: center; justify-content: center; padding: 12px; z-index: 50; }
  .range-modal.open { display: flex; }
  .range-box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
               padding: 14px; width: 100%; max-width: 560px; max-height: 90vh; overflow: auto; }
  .range-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .range-tab { font-size: 11.5px; padding: 5px 9px; border-radius: 999px; border: 1px solid var(--line);
               background: #1b2440; color: var(--muted); cursor: pointer; }
  .range-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .range-grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; }
  .pc { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center;
        font-size: 8.5px; border-radius: 4px; background: #18213a; color: #475569; font-weight: 600; }
  .pc.st-three { background: #7c3aed; color: #fff; }
  .pc.st-call { background: #f59e0b; color: #1f2937; }
  @media (max-width: 480px) { .pc { font-size: 7px; } }

  @media (max-width: 480px) {
    .wrap { padding:10px 10px calc(80px + env(safe-area-inset-bottom)); }
    h1 { font-size:16px; }
    .card-panel { padding:11px; border-radius:10px; }
    .table-wrap { aspect-ratio: 1/1; }
    .felt { left:4%; top:10%; width:92%; height:80%; border-width:5px; }
    .card { width:34px; height:48px; font-size:14px; border-radius:6px; }
    .board .card { width:40px; height:56px; font-size:17px; }
    .pot { top:calc(50% + 48px); font-size:10.5px; padding:2px 9px; }
    .badge { min-width:38px; font-size:10px; padding:3px 7px; }
    .opts { grid-template-columns:1fr; }
    .opt { padding:13px 10px; font-size:15px; }
    .hist { font-size:12.5px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Постфлоп-тренажёр</h1>
    <span class="chip off" id="sync-chip">☁️ выкл</span>
  </header>
  <div class="sub" id="subline">Перед ставкой назови цель и план. Нажми на позицию за столом — покажу её префлоп-диапазон.</div>

  <div class="btns" style="margin:0 0 12px;">
    <button class="plain" id="top-pull" style="flex:1; border-color:#2563eb; color:#93c5fd;">☁️ Из облака</button>
    <button class="plain" id="top-push" style="flex:1; border-color:#16a34a; color:#86efac;">☁️ В облако</button>
  </div>

  <div class="card-panel">
    <div id="spot-list-toggle" style="display:flex; justify-content:space-between; align-items:baseline; gap:8px; cursor:pointer; user-select:none;">
      <h3 style="margin:0; font-size:15px;"><span id="spot-arrow">▾</span> Раздачи в тренажёре</h3>
      <span class="score" id="spot-count"></span>
    </div>
    <div id="spot-list" style="margin-top:10px; display:flex; flex-direction:column; gap:6px;"></div>
  </div>

  <div id="app"></div>

  <div class="card-panel">
    <div class="score" id="score"></div>
    <div class="btns"><button class="plain" id="restart">Начать заново</button></div>
  </div>

  <div class="card-panel">
    <div id="add-toggle" style="display:flex; justify-content:space-between; align-items:center; cursor:pointer; user-select:none;">
      <h3 style="margin:0; font-size:15px;"><span id="add-arrow">▸</span> ➕ Добавить раздачу</h3>
      <span class="chip" id="add-count"></span>
    </div>
    <div id="add-body" class="hidden" style="margin-top:12px;">
      <label>Вставь текст раздачи из лога GG (можно одну)</label>
      <textarea id="add-text" rows="6" placeholder="Poker Hand #HD...: Hold'em No Limit ($0.01/$0.02) ..." style="width:100%; background:#18213a; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px; font-family:monospace; font-size:12px;"></textarea>
      <div class="btns"><button class="primary" id="add-parse">Разобрать текст</button></div>

      <div id="add-form" class="hidden" style="margin-top:10px;">
        <div class="score" id="add-found" style="margin-bottom:8px;"></div>

        <label>Улица</label>
        <select id="add-street" style="width:100%; padding:11px; border-radius:10px; background:#18213a; color:var(--text); border:1px solid var(--line); font-size:15px;">
          <option value="Флоп">Флоп</option><option value="Тёрн">Тёрн</option><option value="Ривер">Ривер</option>
        </select>

        <label>Банк перед решением ($)</label>
        <input type="text" id="add-pot" inputmode="decimal">

        <label>Варианты действий (через запятую)</label>
        <input type="text" id="add-options" value="Чек, Бет 1/3 банка, Бет 2/3 банка, Олл-ин">

        <label>Правильное действие (эталон)</label>
        <input type="text" id="add-correct">

        <label>Цель эталона</label>
        <input type="text" id="add-goal" placeholder="колл от Qx, фолд от A-high">

        <label>План эталона</label>
        <input type="text" id="add-plan" placeholder="на рейз — фолд, на чек — бет 2/3">

        <label>Заметка (почему так)</label>
        <input type="text" id="add-note">

        <div class="btns">
          <button class="primary" id="add-save">Сохранить в тренажёр</button>
          <button class="plain" id="add-cancel">Отмена</button>
        </div>
        <p class="score" id="add-msg" style="margin-top:8px;"></p>
      </div>
    </div>
  </div>

  <div class="card-panel">
    <div id="sync-toggle" style="display:flex; justify-content:space-between; align-items:center; cursor:pointer; user-select:none;">
      <h3 style="margin:0; font-size:15px;"><span id="sync-arrow">▸</span> ☁️ Синхронизация</h3>
      <span class="chip" id="sync-state">не настроена</span>
    </div>
    <div id="sync-body" class="hidden" style="margin-top:12px;">
      <label>Bin ID (JSONBin)</label>
      <input type="text" id="sync-bin" placeholder="65f1a...">
      <label>X-Master-Key</label>
      <input type="password" id="sync-key" placeholder="$2b$10$...">
      <div class="btns">
        <button class="primary" id="sync-connect">Подключить</button>
        <button class="plain" id="sync-pull">Из облака</button>
        <button class="plain" id="sync-push">В облако</button>
        <button class="plain" id="sync-off">Отключить</button>
      </div>
      <p class="score" id="sync-hint" style="margin:10px 0 0;"></p>
    </div>
  </div>

  <div class="btns" style="margin-top:0;">
    <button class="plain hidden" id="install-btn" style="flex:1;">📲 Установить на телефон</button>
  </div>
</div>

<div class="range-modal" id="range-modal">
  <div class="range-box">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px;">
      <h3 id="range-title" style="margin:0; font-size:15px;">Диапазон</h3>
      <button class="plain" id="range-close" style="padding:6px 12px;">Закрыть</button>
    </div>
    <div id="range-tabs" class="range-tabs"></div>
    <div id="range-grid" class="range-grid"></div>
    <div id="range-legend" class="score" style="margin-top:8px;"></div>
  </div>
</div>



<script>
/*CORE-BEGIN*/

const SUIT = { s: "♠", h: "♥", d: "♦", c: "♣" };

function cardHtml(card) {
  const r = card[0], s = card[1];
  const red = (s === "h" || s === "d") ? " red" : "";
  return `<div class="card${red}"><span>${r}</span><span>${SUIT[s]}</span></div>`;
}

function boardHtml(board) { return board.split(" ").map(cardHtml).join(""); }
function normalize(s) { return (s || "").toLowerCase().replace(/\s+/g, " ").trim(); }

function goalIsNamed(text) {
  const t = normalize(text);
  if (t.length < 8) return false;
  return ["колл", "фолд", "выбить", "заплат", "хуже", "лучше", "дро", "вэлью", "сфолд"].some(k => t.includes(k));
}

function planIsNamed(text) {
  const t = normalize(text);
  if (t.length < 10) return false;
  return ["тёрн", "терн", "ривер", "флоп", "если", "чек", "бет", "фолд", "колл"].some(k => t.includes(k));
}

function tableHtml(spot) {
  const heroPos = spot.position === "EP" ? "UTG" : spot.position;
  const heroIdx = RING.indexOf(heroPos);
  const seats = SLOTS.map((slot, i) => {
    const key = RING[(heroIdx + i) % RING.length];
    const hero = i === 0;
    const label = key === "UTG" ? "EP" : key;
    const villain = !hero && (spot.villains || []).includes(label);
    const cards = hero ? `<div class="cards">${spot.hole.split(" ").map(cardHtml).join("")}</div>` : "";
    const dealer = (key === "BTN") ? `<div class="dealer" style="left:calc(50% + 24px); top:1px;">D</div>` : "";
    return `<div class="seat" style="left:${slot.x}%; top:${slot.y}%;" data-pos="${label}">
        ${cards}<div class="badge${hero ? " hero" : ""}${villain ? " villain" : ""} range-open">${label}</div>${dealer}
      </div>`;
  }).join("");

  return `<div class="table-wrap">
      <div class="felt"></div>${seats}
      <div class="board">${boardHtml(spot.board)}</div>
      <div class="pot">Банк $${spot.pot.toFixed(2)} · стек $${spot.stack.toFixed(2)}</div>
    </div>`;
}

const RANKS13 = "AKQJT98765432";

function rIdx(c) { return RANKS13.indexOf(c); }

function expandRange(spec) {
  const out = new Set();
  if (!spec) return out;
  for (const raw of String(spec).split(",")) {
    const t = raw.trim();
    if (!t) continue;

    // диапазон вида 22-99 или A2s-A9s
    const dash = t.match(/^([2-9TJQKA])([2-9TJQKA])([so]?)-([2-9TJQKA])([2-9TJQKA])([so]?)$/);
    if (dash) {
      const [, r1, r2, su1, r3, r4] = dash;
      if (r1 === r2) {
        const a = rIdx(r1), b = rIdx(r3);
        for (let k = Math.min(a, b); k <= Math.max(a, b); k++) out.add(RANKS13[k] + RANKS13[k]);
      } else {
        const suf = su1 || "s";
        const hi = r1, lo1 = rIdx(r2), lo2 = rIdx(r4);
        for (let k = Math.min(lo1, lo2); k <= Math.max(lo1, lo2); k++) {
          if (RANKS13[k] !== hi) out.add(hi + RANKS13[k] + suf);
        }
      }
      continue;
    }

    const plus = t.endsWith("+");
    const base = plus ? t.slice(0, -1) : t;
    const m = base.match(/^([2-9TJQKA])([2-9TJQKA])([so]?)$/);
    if (!m) continue;
    const [, r1, r2, suffix] = m;

    // RANKS13 = "AKQJT98765432": индекс 0 — туз, дальше по убыванию силы.
    if (r1 === r2) {
      const from = rIdx(r1);
      const to = plus ? 0 : from;
      for (let k = from; k >= to; k--) out.add(RANKS13[k] + RANKS13[k]);
      continue;
    }

    const hi = r1;
    const loFrom = rIdx(r2);
    const loTo = plus ? rIdx(hi) + 1 : loFrom;
    for (let k = loFrom; k >= loTo; k--) {
      const lo = RANKS13[k];
      if (lo === hi) continue;
      if (suffix === "s") out.add(hi + lo + "s");
      else if (suffix === "o") out.add(hi + lo + "o");
      else { out.add(hi + lo + "s"); out.add(hi + lo + "o"); }
    }
  }
  return out;
}

function rangesForPosition(pos) {
  const list = [];
  const key = pos === "EP" ? "EP" : pos;

  if (RANGES_PREFLOP.rfi && RANGES_PREFLOP.rfi[key]) {
    list.push({ label: "Открытие (RFI) с " + key, three: expandRange(RANGES_PREFLOP.rfi[key]), call: new Set() });
  }

  const threeIp = RANGES_PREFLOP["3bet_ip"] || {};
  const threeOop = RANGES_PREFLOP["3bet_oop"] || {};
  Object.keys(threeIp).forEach(spot => {
    if (spot.startsWith(key + " ")) {
      list.push({ label: "3-бет: " + spot, three: expandRange(threeIp[spot]), call: new Set() });
    }
  });
  Object.keys(threeOop).forEach(spot => {
    if (spot.startsWith(key + " ")) {
      list.push({ label: "3-бет: " + spot, three: expandRange(threeOop[spot]), call: new Set() });
    }
  });

  if (key === "BB" && RANGES_PREFLOP.bb) {
    Object.keys(RANGES_PREFLOP.bb).forEach(spot => {
      const d = RANGES_PREFLOP.bb[spot];
      list.push({
        label: "Защита BB " + spot,
        three: expandRange(d["3bet"]),
        call: d["call"] === "__COMPUTED__" ? new Set() : expandRange(d["call"])
      });
    });
  }
  return list;
}

function gridCells(entry) {
  const cells = [];
  for (let i = 0; i < 13; i++) {
    for (let j = 0; j < 13; j++) {
      const r1 = RANKS13[i], r2 = RANKS13[j];
      let hand, cls;
      if (i === j) { hand = r1 + r1; cls = "pair"; }
      else if (i < j) { hand = r1 + r2 + "s"; cls = "suited"; }
      else { hand = r2 + r1 + "o"; cls = "offsuit"; }
      let state = "";
      if (entry.three.has(hand)) state = "st-three";
      else if (entry.call.has(hand)) state = "st-call";
      cells.push(`<div class="pc ${cls} ${state}">${hand}</div>`);
    }
  }
  return cells.join("");
}

function openRangeModal(pos, spotIndex) {
  const list = rangesForPosition(pos);
  const modal = document.getElementById("range-modal");
  if (!modal) return;
  if (!list.length) {
    document.getElementById("range-title").textContent = pos;
    document.getElementById("range-tabs").innerHTML = "";
    document.getElementById("range-grid").innerHTML = "<p class='score'>Для этой позиции чартов нет.</p>";
    document.getElementById("range-legend").textContent = "";
    modal.classList.add("open");
    return;
  }
  let active = Math.min(spotIndex || 0, list.length - 1);
  document.getElementById("range-title").textContent = "Диапазон: " + pos;

  const tabs = list.map((e, i) =>
    `<button class="range-tab${i === active ? " active" : ""}" data-tab="${i}">${e.label}</button>`).join("");
  document.getElementById("range-tabs").innerHTML = tabs;

  const draw = (idx) => {
    const e = list[idx];
    document.getElementById("range-grid").innerHTML = gridCells(e);
    document.getElementById("range-legend").textContent =
      (e.three.size ? "3-бет/рейз: " + e.three.size + " рук" : "") +
      (e.call.size ? " · колл: " + e.call.size + " рук" : "");
    document.querySelectorAll(".range-tab").forEach((b, i2) => b.classList.toggle("active", i2 === idx));
  };
  draw(active);

  document.getElementById("range-tabs").querySelectorAll(".range-tab").forEach(b => {
    b.addEventListener("click", () => draw(Number(b.dataset.tab)));
  });

  modal.classList.add("open");
}

/* ---------- состояние и синхронизация ---------- */
const STATE_KEY = "pp_state";
const SYNC_KEY = "pp_sync_config";

let state = { answered: [], stats: { answered: 0, goal: 0, plan: 0 }, answers: [], savedAt: 0, note: "" };
try {
  const raw = JSON.parse(localStorage.getItem(STATE_KEY) || "{}");
  if (raw && typeof raw === "object") state = Object.assign(state, raw);
  if (!Array.isArray(state.answered)) state.answered = [];
  if (!state.stats) state.stats = { answered: 0, goal: 0, plan: 0 };
  if (!Array.isArray(state.answers)) state.answers = [];
} catch (e) {}

function saveState() {
  state.savedAt = Date.now();
  try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch (e) {}
}

function syncCfg() {
  try { return JSON.parse(localStorage.getItem(SYNC_KEY) || "null"); } catch (e) { return null; }
}

function updateSyncUI() {
  const cfg = syncCfg();
  const chip = document.getElementById("sync-chip");
  const st = document.getElementById("sync-state");
  const hint = document.getElementById("sync-hint");
  if (chip) {
    chip.className = "chip " + (cfg ? "on" : "off");
    chip.textContent = cfg ? "☁️ синк" : "☁️ выкл";
  }
  if (st) st.textContent = cfg ? "подключена" : "не настроена";
  if (cfg && hint) hint.textContent = "Данные уходят в облако после каждого ответа.";
}

async function cloudPull(silent) {
  const cfg = syncCfg();
  if (!cfg || !cfg.binId || !cfg.apiKey) return false;
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${cfg.binId}/latest`, { headers: { "X-Master-Key": cfg.apiKey } });
    if (!res.ok) { if (!silent) alert("JSONBin: ошибка " + res.status); return false; }
    const json = await res.json();
    const rec = json.record || {};
    if (rec.stats) {
      state = Object.assign({}, state, rec);
      saveState();
      bootQuiz();
      updateAddCount();
      if (!silent) alert("Загружено из облака");
      return true;
    }
    if (!silent) alert("В облаке пока нет данных");
  } catch (e) {
    if (!silent) alert("Ошибка сети");
  }
  return false;
}

let pushTimer = null;
function cloudPush(force) {
  const cfg = syncCfg();
  if (!cfg || !cfg.binId || !cfg.apiKey) return;
  if (pushTimer) clearTimeout(pushTimer);
  pushTimer = setTimeout(async () => {
    try {
      await fetch(`https://api.jsonbin.io/v3/b/${cfg.binId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", "X-Master-Key": cfg.apiKey },
        body: JSON.stringify({ savedAt: new Date().toISOString(), ...state })
      });
    } catch (e) {}
  }, force ? 0 : 800);
}

/* ---------- тренажёр ---------- */
let idx = 0, selected = null, answered = false;
const answeredSet = new Set(state.answered || []);

function saveAnswered() {
  state.answered = Array.from(answeredSet);
  saveState();
  cloudPush();
}

function renderSpotList() {
  const box = document.getElementById("spot-list");
  const counter = document.getElementById("spot-count");
  if (!box) return;
  box.innerHTML = SPOTS.map((s, i) => {
    const done = answeredSet.has(i);
    const mine = s.addedBy === "pilot";
    const del = mine
      ? `<button class="spot-del" data-del="${i}" title="Удалить раздачу"
           style="flex:0 0 34px; border:1px solid #7f1d1d; background:#2a1520; color:#f87171;
                  border-radius:9px; cursor:pointer; font-size:15px; line-height:1;">×</button>`
      : "";
    return `<div style="display:flex; gap:6px; align-items:stretch;">
      <button class="spot-row${i === idx ? " current" : ""}" data-i="${i}" style="flex:1;">
        <b>${i + 1}.</b>
        <span>${s.id}${s.correct ? "" : " · без эталона"}</span>
        <span style="color:var(--muted);">${s.street} · ${s.board} · ${s.hole} · ${s.position}</span>
        <span style="font-size:10.5px; padding:1px 7px; border-radius:999px; border:1px solid ${mine ? "#2563eb" : "#4b5563"}; color:${mine ? "#93c5fd" : "#9ca3af"};">${mine ? "моя" : "тренер"}</span>
        ${done ? '<span style="margin-left:auto; color:#10b981; font-weight:700;">✓</span>' : ""}
      </button>
      ${del}
    </div>`;
  }).join("");

  box.querySelectorAll(".spot-row").forEach(b => b.addEventListener("click", () => {
    idx = Number(b.dataset.i);
    selected = null;
    answered = false;
    render();
  }));
  box.querySelectorAll(".spot-del").forEach(b => b.addEventListener("click", (e) => {
    e.stopPropagation();
    deleteSpot(Number(b.dataset.del));
  }));

  if (counter) counter.textContent = `пройдено ${answeredSet.size} из ${SPOTS.length}`;
}

function deleteSpot(i) {
  const s = SPOTS[i];
  if (!s) return;
  if (s.addedBy !== "pilot") return alert("Это раздача тренера — её удалить нельзя.");
  if (!confirm(`Удалить раздачу ${s.id} (${s.street}, ${s.board})?`)) return;

  state.custom = (state.custom || []).filter(x => !(x.id === s.id && x.street === s.street && x.board === s.board));
  saveState();
  cloudPush(true);
  rebuildSpots();
  answeredSet.clear();
  (state.answered || []).forEach(k => answeredSet.add(Number(k)));
  if (idx >= SPOTS.length) idx = Math.max(0, SPOTS.length - 1);
  render();
  updateAddCount();
}

function render() {
  const app = document.getElementById("app");
  if (idx >= SPOTS.length) {
    app.innerHTML = `<div class="card-panel"><h2 style="margin-top:0;">Прототип пройден</h2>
      <p>Решений: ${state.stats.answered} · цель названа: ${state.stats.goal} · план назван: ${state.stats.plan}</p>
      <p class="score">Полная версия: споты из логов по кнопке, разбивка по улицам и ошибкам, синхронизация с Хабом.</p></div>`;
    updateScore();
    renderSpotList();
    return;
  }
  const s = SPOTS[idx];
  app.innerHTML = `
    <div class="card-panel">
      <div style="display:flex; justify-content:space-between; color:var(--muted); font-size:12px; margin-bottom:8px;">
        <span>${s.id} <span style="color:${s.addedBy === "pilot" ? "#93c5fd" : "#9ca3af"};">· ${s.addedBy === "pilot" ? "моя раздача" : "раздача тренера"}</span>${(s.villains && s.villains.length) ? ` <span style="color:#fca5a5;">· против ${s.villains.join(", ")}</span>` : ""}</span><span class="tag">${s.street}</span>

      <label>План на следующую улицу</label>

      </div>
      <div class="verdict" id="verdict"></div>
    </div>
  `;
  const tableEl = document.querySelector(".table-wrap");
  if (tableEl) tableEl.addEventListener("click", e => {
    const seat = e.target.closest(".seat");
    if (!seat || !seat.dataset.pos) return;
    openRangeModal(seat.dataset.pos, 0);
  });

  document.getElementById("opts").addEventListener("click", (e) => {
    const b = e.target.closest(".opt");
    if (!b || answered) return;
    document.querySelectorAll(".opt").forEach(x => x.classList.remove("sel"));
    b.classList.add("sel");
    selected = b.dataset.opt;
  });
  document.getElementById("check").addEventListener("click", check);
  document.getElementById("next").addEventListener("click", () => { idx++; selected = null; answered = false; render(); });
  updateScore();
  renderSpotList();
}

function check() {
  if (answered) return;
  const s = SPOTS[idx];
  const goal = document.getElementById("goal").value;
  const plan = document.getElementById("plan").value;
  const v = document.getElementById("verdict");

  const hasCorrect = !!(s.correct && s.correct.trim());
  const actOk = hasCorrect ? (selected === s.correct) : null;
  const gOk = goalIsNamed(goal);
  const pOk = planIsNamed(plan);

  answered = true;
  answeredSet.add(idx);
  state.stats.answered++;
  if (gOk) state.stats.goal++;
  if (pOk) state.stats.plan++;

  state.answers.push({
    at: new Date().toISOString(),
    hand: s.id,
    street: s.street,
    board: s.board,
    hole: s.hole,
    position: s.position,
    action: selected || "",
    correct: s.correct || "",
    actOk: actOk === null ? null : actOk,
    goal: goal,
    goalOk: gOk,
    plan: plan,
    planOk: pOk
  });
  if (state.answers.length > 300) state.answers = state.answers.slice(-300);

  saveAnswered();

  v.innerHTML = `
    <div style="margin-bottom:10px;">
      <span class="${actOk === null ? 'mid' : (actOk ? 'ok' : 'no')}">${actOk === null ? '⚠️ эталон не задан — действие не оцениваю' : (actOk ? '✅ действие верное' : '❌ действие: эталон — ' + s.correct)}</span>
      <span style="color:var(--muted);"> · </span>
      <span class="${gOk ? 'ok' : 'mid'}">${gOk ? '✅ цель названа' : '⚠️ цель не названа'}</span>
      <span style="color:var(--muted);"> · </span>
      <span class="${pOk ? 'ok' : 'mid'}">${pOk ? '✅ план назван' : '⚠️ план не назван'}</span>
    </div>
    <div style="background:#18213a; border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px;">
      <div style="margin-bottom:6px;"><b>Цель эталона:</b> ${s.goal}</div>
      <div><b>План эталона:</b> ${s.plan}</div>
    </div>
    <div style="color:#cbd5e1; font-size:13px;">${s.note}</div>
  `;
  updateScore();
  renderSpotList();
}

function updateScore() {
  const el = document.getElementById("score");
  if (el) el.textContent = `Счёт: ${state.stats.answered} решений, цель названа ${state.stats.goal} раз, план ${state.stats.plan} раз.`;
}

/* ---------- список: сворачивание ---------- */
const LIST_KEY = "trainerSpotsOpen";
function applyListState(open) {
  const list = document.getElementById("spot-list");
  const arrow = document.getElementById("spot-arrow");
  if (!list) return;
  list.style.display = open ? "flex" : "none";
  if (arrow) arrow.textContent = open ? "▾" : "▸";
}
function initListToggle() {
  const toggle = document.getElementById("spot-list-toggle");
  if (!toggle) return;
  let open = true;
  try { open = localStorage.getItem(LIST_KEY) !== "0"; } catch (e) {}
  applyListState(open);
  toggle.addEventListener("click", () => {
    const isOpen = document.getElementById("spot-list").style.display !== "none";
    applyListState(!isOpen);
    try { localStorage.setItem(LIST_KEY, !isOpen ? "1" : "0"); } catch (e) {}
  });
}

/* ---------- синхронизация: кнопки ---------- */
function initSync() {
  const toggle = document.getElementById("sync-toggle");
  const body = document.getElementById("sync-body");
  const arrow = document.getElementById("sync-arrow");
  const cfg = syncCfg();
  if (cfg) {
    document.getElementById("sync-bin").value = cfg.binId || "";
    document.getElementById("sync-key").value = cfg.apiKey || "";
  }
  if (toggle) toggle.addEventListener("click", () => {
    const hidden = body.classList.contains("hidden");
    body.classList.toggle("hidden", !hidden);
    if (arrow) arrow.textContent = hidden ? "▾" : "▸";
  });

  document.getElementById("sync-connect").addEventListener("click", async () => {
    const binId = document.getElementById("sync-bin").value.trim();
    const apiKey = document.getElementById("sync-key").value.trim();
    if (!binId || !apiKey) return alert("Заполни Bin ID и ключ");
    localStorage.setItem(SYNC_KEY, JSON.stringify({ binId, apiKey }));
    updateSyncUI();
    const pulled = await cloudPull(true);
    if (!pulled) cloudPush(true);
    alert("Подключено");
  });

  document.getElementById("sync-pull").addEventListener("click", () => {
    if (confirm("Загрузить из облака? Локальный прогресс будет заменён.")) cloudPull(false);
  });

  document.getElementById("sync-push").addEventListener("click", () => { cloudPush(true); alert("Отправлено в облако"); });

  const topPull = document.getElementById("top-pull");
  const topPush = document.getElementById("top-push");
  if (topPull) topPull.addEventListener("click", () => {
    if (!syncCfg()) { alert("Сначала подключи синхронизацию: Bin ID и ключ ниже."); return; }
    cloudPull(false);
  });
  if (topPush) topPush.addEventListener("click", () => {
    if (!syncCfg()) { alert("Сначала подключи синхронизацию: Bin ID и ключ ниже."); return; }
    cloudPush(true);
    alert("Отправлено в облако");
  });

  document.getElementById("sync-off").addEventListener("click", () => {
    if (!confirm("Отключить синхронизацию?")) return;
    localStorage.removeItem(SYNC_KEY);
    updateSyncUI();
  });
}

/* ---------- установка как приложение ---------- */
let installEvent = null;
function initInstall() {
  const btn = document.getElementById("install-btn");
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    installEvent = e;
    btn.classList.remove("hidden");
  });
  btn.addEventListener("click", async () => {
    if (!installEvent) return;
    installEvent.prompt();
    await installEvent.userChoice;
    installEvent = null;
    btn.classList.add("hidden");
  });
  window.addEventListener("appinstalled", () => btn.classList.add("hidden"));
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

function rebuildSpots() {
  BUILTIN_SPOTS.forEach(s => { if (!s.addedBy) s.addedBy = "coach"; });
  (state.custom || []).forEach(s => { if (!s.addedBy) s.addedBy = "pilot"; });
  SPOTS = BUILTIN_SPOTS.concat(state.custom || []);
}

function bootQuiz() {
  rebuildSpots();
  idx = 0; selected = null; answered = false;
  answeredSet.clear();
  (state.answered || []).forEach(i => answeredSet.add(Number(i)));
  render();
  updateScore();
}

document.getElementById("restart").addEventListener("click", () => {
  if (!confirm("Сбросить прогресс тренажёра?")) return;
  answeredSet.clear();
  state.answered = [];
  state.stats = { answered: 0, goal: 0, plan: 0 };
  state.answers = [];
  saveState();
  cloudPush(true);
  bootQuiz();
});


/* ---------- добавление раздачи из текста лога ---------- */
const POS6 = ["SB", "BB", "UTG", "MP", "CO", "BTN"];
const POS5 = ["SB", "BB", "UTG", "CO", "BTN"];
const POS4 = ["SB", "BB", "CO", "BTN"];
const POS3 = ["SB", "BB", "BTN"];
const POS2 = ["SB", "BB"];

let parsedSpot = null;

function parseHandText(text) {
  const idm = text.match(/Poker Hand #(\w+)/);
  if (!idm) return null;
  const id = idm[1];

  const holeM = text.match(/Dealt to Hero \[([^\]]+)\]/);
  const hole = holeM ? holeM[1].trim() : "";

  // места и кнопка -> позиция
  const seats = [...text.matchAll(/Seat (\d+): (\w+) \(\$[\d.]+ in chips\)/g)].map(m => ({ n: +m[1], name: m[2] }));
  const btnM = text.match(/Seat #(\d+) is the button/);
  let position = "";
  if (seats.length && btnM) {
    const btn = +btnM[1];
    const maxSeat = Math.max(...seats.map(x => x.n));
    const order = [];
    for (let k = 1; k <= maxSeat; k++) {
      const n = ((btn - 1 + k) % maxSeat) + 1;
      const seat = seats.find(x => x.n === n);
      if (seat) order.push(seat.name);
    }
    const labels = { 6: POS6, 5: POS5, 4: POS4, 3: POS3, 2: POS2 }[order.length] || order.map((_, i) => "P" + i);
    const hi = order.indexOf("Hero");
    position = hi >= 0 ? labels[hi] : "";
  }

  const stackM = text.match(/Seat \d+: Hero \(\$([\d.]+) in chips\)/);
  const stack = stackM ? +stackM[1] : 0;

  // улицы и доски
  const boards = {};
  let street = "PRE";
  const lines = text.split(/\r?\n/);
  const hist = [];
  let committed = {};
  let board = "";
  const decisions = [];

  for (const line of lines) {
    const sm = line.match(/^\*\*\* (?:FIRST |SECOND )?(FLOP|TURN|RIVER|SHOWDOWN|SUMMARY) \*\*\*(.*)$/);
    if (sm) {
      street = sm[1];
      const allBrackets = [...sm[2].matchAll(/\[([^\]]*)\]/g)].map(x => x[1].trim());
      if (["FLOP", "TURN", "RIVER"].includes(street) && allBrackets.length) {
        const cards = allBrackets.join(" ").split(/\s+/).filter(Boolean);
        boards[street] = cards.join(" ");
        board = boards[street];
      }
      continue;
    }
    if (!["PRE", "FLOP", "TURN", "RIVER"].includes(street)) continue;
    if (!line.trim()) continue;

    const heroAct = line.match(/^Hero: (checks|bets|calls|raises|folds)(?:[^$]*\$([\d.]+))?(?: to \$([\d.]+))?/);
    if (heroAct && street !== "PRE") {
      decisions.push({
        street,
        board,
        pot: +Object.values(committed).reduce((a, b) => a + b, 0).toFixed(2),
        action: heroAct[1],
        history: hist.slice(-12).join("\n")
      });
    }

    const post = line.match(/^(\w+): posts (?:small|big) blind \$([\d.]+)/);
    const bet = line.match(/^(\w+): bets \$([\d.]+)/);
    const raise = line.match(/^(\w+): raises \$([\d.]+) to \$([\d.]+)/);
    const call = line.match(/^(\w+): calls \$([\d.]+)/);
    if (post) committed[post[1]] = (committed[post[1]] || 0) + +post[2];
    else if (bet) committed[bet[1]] = (committed[bet[1]] || 0) + +bet[2];
    else if (raise) committed[raise[1]] = +raise[3];
    else if (call) committed[call[1]] = (committed[call[1]] || 0) + +call[2];

    if (!line.startsWith("Dealt to") && !line.startsWith("Seat ") && !line.startsWith("Table ")) hist.push(line);
  }

  // кто остался в раздаче к флопу (кроме Hero)
  const preBlock = (text.split(/\*\*\* FLOP \*\*\*/)[0] || "");
  const foldedPre = new Set([...preBlock.matchAll(/^(\w+): folds/gm)].map(m => m[1]));
  const inPre = new Set([...preBlock.matchAll(/^(\w+): (?:calls|raises|bets) \$/gm)].map(m => m[1]));
  const heroPos = position === "EP" ? "UTG" : position;
  const heroIdx2 = RING.indexOf(heroPos);
  const labelOf = {};
  if (heroIdx2 >= 0) SLOTS.forEach((_, i) => { labelOf[i] = RING[(heroIdx2 + i) % RING.length]; });

  const order = Object.values(labelOf);
  const seatNames = [...text.matchAll(/Seat (\d+): (\w+) \(/g)].map(m => m[2]);
  const posByName = {};
  seats.forEach((s2, i2) => { posByName[s2.name] = order[i2] || ""; });

  const villains = [...inPre].filter(n => n !== "Hero" && !foldedPre.has(n))
    .map(n => (posByName[n] === "UTG" ? "EP" : posByName[n])).filter(Boolean);

  return { id, hole, position, stack, decisions, boards, villains };
}

function streetRu(en) { return { FLOP: "Флоп", TURN: "Тёрн", RIVER: "Ривер" }[en] || "Флоп"; }

function initAddPanel() {
  const toggle = document.getElementById("add-toggle");
  const body = document.getElementById("add-body");
  const arrow = document.getElementById("add-arrow");
  if (!toggle) return;

  toggle.addEventListener("click", () => {
    const hidden = body.classList.contains("hidden");
    body.classList.toggle("hidden", !hidden);
    arrow.textContent = hidden ? "▾" : "▸";
  });

  document.getElementById("add-parse").addEventListener("click", () => {
    const text = document.getElementById("add-text").value;
    const res = parseHandText(text);
    if (!res || !res.hole) return alert("Не нашёл раздачу. Нужен текст лога GG с «Dealt to Hero».");
    if (!res.decisions.length) return alert("В этой раздаче нет постфлоп-решений Hero.");

    const d = res.decisions[0];
    parsedSpot = {
      id: res.id,
      hole: res.hole,
      position: res.position,
      stack: res.stack,
      board: d.board,
      street: streetRu(d.street),
      pot: d.pot,
      hist: d.history,
      villains: res.villains || []
    };

    document.getElementById("add-found").textContent =
      `${res.id} · ${res.hole} · ${res.position} · решений в раздаче: ${res.decisions.length} (беру первое)`;
    document.getElementById("add-street").value = parsedSpot.street;
    document.getElementById("add-pot").value = parsedSpot.pot.toFixed(2);
    document.getElementById("add-form").classList.remove("hidden");
    document.getElementById("add-msg").textContent = "";
  });

  document.getElementById("add-cancel").addEventListener("click", () => {
    document.getElementById("add-form").classList.add("hidden");
    parsedSpot = null;
  });

  document.getElementById("add-save").addEventListener("click", () => {
    if (!parsedSpot) return;
    const options = document.getElementById("add-options").value.split(",").map(x => x.trim()).filter(Boolean);
    let correct = document.getElementById("add-correct").value.trim();
    if (!options.length) return alert("Нужен хотя бы один вариант действия");
    if (correct && !options.includes(correct)) options.push(correct);

    const spot = {
      id: parsedSpot.id,
      street: document.getElementById("add-street").value,
      board: parsedSpot.board,
      hole: parsedSpot.hole,
      position: parsedSpot.position,
      pot: parseFloat(document.getElementById("add-pot").value) || parsedSpot.pot,
      stack: parsedSpot.stack,
      hist: parsedSpot.hist,
      villains: parsedSpot.villains || [],
      options,
      correct,
      goal: document.getElementById("add-goal").value.trim(),
      plan: document.getElementById("add-plan").value.trim(),
      note: document.getElementById("add-note").value.trim(),
      custom: true,
      addedBy: "pilot"
    };

    state.custom = (state.custom || []).filter(x => !(x.id === spot.id && x.street === spot.street));
    state.custom.push(spot);
    saveState();
    cloudPush(true);

    SPOTS = BUILTIN_SPOTS.concat(state.custom);
    renderSpotList();
    document.getElementById("add-form").classList.add("hidden");
    document.getElementById("add-text").value = "";
    document.getElementById("add-msg").textContent = "Раздача добавлена в тренажёр и отправлена в облако.";
    updateAddCount();
  });
}

function updateAddCount() {
  const el = document.getElementById("add-count");
  if (!el) return;
  const n = (state.custom || []).length;
  el.textContent = n ? `моих: ${n}` : "";
}

/* старт */
updateSyncUI();
initSync();
initInstall();
bootQuiz();
initListToggle();
initAddPanel();

document.getElementById("range-close").addEventListener("click", () => {
  document.getElementById("range-modal").classList.remove("open");
});
document.getElementById("range-modal").addEventListener("click", (e) => {
  if (e.target.id === "range-modal") e.target.classList.remove("open");
});
updateAddCount();
if (syncCfg()) cloudPull(true);
</script>
