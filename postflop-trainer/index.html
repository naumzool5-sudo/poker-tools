<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажёр постфлопа (прототип)</title>
<style>
  :root { --bg:#0f172a; --panel:#16203a; --line:#24304d; --text:#e2e8f0; --muted:#8b98ad; --accent:#3b82f6; --good:#10b981; --bad:#ef4444; --warn:#f59e0b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 -apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  .wrap { max-width:820px; margin:0 auto; padding:18px 14px 60px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:12px; margin-bottom:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .rowline { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; color:var(--muted); font-size:12px; margin-bottom:10px; }
  .board { display:flex; gap:8px; margin:12px 0 6px; }
  .c { width:52px; height:72px; border-radius:8px; background:#0b1324; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; }
  .c-s { color:#e2e8f0; } .c-h { color:#ef4444; } .c-d { color:#3b82f6; } .c-c { color:#10b981; }
  .hole { font-size:15px; margin-bottom:10px; }
  .hist { background:#0b1324; border:1px solid var(--line); border-radius:8px; padding:10px; font-size:13px; color:#cbd5e1; white-space:pre-line; margin-bottom:12px; }
  .opts { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .opt { padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:#131c31; color:var(--text); font-weight:600; cursor:pointer; font-size:13px; }
  .opt.sel { background:var(--accent); border-color:var(--accent); color:#fff; }
  label { display:block; color:var(--muted); font-size:12px; margin:10px 0 4px; }
  input[type=text] { width:100%; padding:9px 11px; background:#0b1324; color:var(--text); border:1px solid var(--line); border-radius:8px; font-size:14px; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  button.primary { padding:10px 16px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; font-weight:700; cursor:pointer; }
  button.plain { padding:10px 16px; border-radius:8px; border:1px solid var(--line); background:#131c31; color:var(--text); font-weight:600; cursor:pointer; }
  .verdict { margin-top:14px; font-size:14px; }
  .ok { color:var(--good); } .no { color:var(--bad); } .mid { color:var(--warn); }
  .score { color:var(--muted); font-size:13px; }
  .tag { display:inline-block; padding:1px 8px; border-radius:99px; border:1px solid var(--line); font-size:11px; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Тренажёр постфлопа</h1>
  <div class="sub">Прототип: 5 раздач из твоей сессии 26.11. Задача одна — перед ставкой назвать цель и план.</div>

  <div id="app"></div>

  <div class="card">
    <div class="score" id="score">Счёт: 0 решений, цель названа 0 раз, план 0 раз.</div>
    <div class="btns">
      <button class="plain" id="restart">Начать заново</button>
    </div>
  </div>
</div>

<script>
/*CORE-BEGIN*/
const SPOTS = [
  {
    id: "HD3155428523",
    pos: "CO", stack: 2.06, pot: 0.14, street: "Флоп",
    board: "Ah Jd 2d", hole: "Js Jh",
    hist: "Префлоп: ты открыл до $0.06, BTN заколлировал.\nФлоп: ты ставишь $0.13, BTN колл.\nТёрн: ты ставишь $0.20, BTN колл.\nРивер: ты ставишь $0.79, BTN идёт олл-ин, ты коллишь $0.88.",
    options: ["Чек", "Бет 1/3 банка", "Бет 2/3 банка", "Олл-ин"],
    correct: "Бет 1/3 банка",
    goal: "Хочу колл от Ax и от Jx. Фолды мне не нужны: слабее почти ничего нет, но тузы платят три улицы.",
    plan: "Тёрн: бет ~2/3 на спаренной доске. Ривер: добор 3/4, но на рейз — не скидывать сет (правило ривера).",
    note: "Сет на A-high — это ставка на колл, а не на фолд. Малый размер на флопе — чтобы не выгнать тузы."
  },
  {
    id: "HD3155383397",
    pos: "BTN", stack: 2.97, pot: 0.15, street: "Флоп",
    board: "8s Qh 7h", hole: "Ah Qs",
    hist: "Префлоп: ты открыл до $0.06, BB заколлировал.\nФлоп: BB чек.",
    options: ["Чек", "Бет 1/3 банка", "Бет 2/3 банка", "Олл-ин"],
    correct: "Бет 2/3 банка",
    goal: "Колл от Qx и от флеш-дро. Дро с сердцем не выкидываю бесплатно: у меня нет блокера на пики/червы, доска дровяная.",
    plan: "Тёрн на несвязанной карте — второй баррель. На рейз флопа — фолд: на NL2 чек-рейз флопа это сила.",
    note: "Топ-пара с тузом на дровяной доске — ставка крупнее, потому что оплачивает дро. Но не для стека: на рейз флопа ты фолдишь."
  },
  {
    id: "HD3155456312",
    pos: "BTN", stack: 1.91, pot: 0.45, street: "Тёрн",
    board: "Ah 9h Js 4h", hole: "Ac Kc",
    hist: "Префлоп: ты открыл до $0.06, BB заколлировал.\nФлоп: бет $0.07 — колл.\nТёрн: BB чек.",
    options: ["Чек", "Бет 1/3 банка", "Бет 2/3 банка", "Олл-ин"],
    correct: "Бет 1/3 банка",
    goal: "Колл от Ax и Jx. Хочу также забрать пот у дро, но размером не раздувать: на этой доске любой рейз означает флеш.",
    plan: "На рейз — сразу фолд: у меня топ-пара без червы, флеш уже собрался.",
    note: "То же правило, что и в раздаче #2, только размер меньше: доска стала мокрее, а рука не усилилась."
  },
  {
    id: "HD3155459956",
    pos: "BB", stack: 2.47, pot: 0.44, street: "Тёрн",
    board: "4s Ks 5c 3c", hole: "Kh Ah",
    hist: "Префлоп: ты заколлировал рейз до $0.20.\nФлоп: чек, соперник ставит $0.18, ты колл.\nТёрн: чек соперника.",
    options: ["Чек", "Бет 1/2 банка", "Бет 2/3 банка", "Олл-ин"],
    correct: "Бет 1/2 банка",
    goal: "Колл от Kx и от дро. Олл-ин цели не имеет: хуже не заплатят, лучше не сфолдят.",
    plan: "Ривер: если карта не закрывает дро — небольшой добор, иначе чек.",
    note: "Это та самая раздача, где ты шовнул $2.07 в банк $0.44. Ставка там не имела адресата — ни колла от худших, ни фолда от лучших."
  },
  {
    id: "HD3155458905",
    pos: "BB", stack: 2.42, pot: 0.30, street: "Ривер",
    board: "3s Td Ks 4d 7s", hole: "9s Qs",
    hist: "Префлоп: колл рейза.\nФлоп и тёрн: чек-чек.\nРивер: соперник чек.",
    options: ["Чек", "Бет 1/3 банка", "Бет 2/3 банка", "Олл-ин"],
    correct: "Бет 1/3 банка",
    goal: "Хочу фолд от A-high и от мелких пар, которые дошли до вскрытия. Своей рукой я не выигрываю вскрытие — Q-high.",
    plan: "Если колл — на этом всё, ставку не продолжаю.",
    note: "Это блеф с адресатом: говорю, кого выбиваю. Такая ставка — не «на всякий случай», а решение."
  }
];

function parseCard(s) {
  return { rank: s[0], suit: s[1] };
}

function cardHtml(card) {
  const { rank, suit } = parseCard(card);
  const sym = { s: "♠", h: "♥", d: "♦", c: "♣" }[suit];
  return `<div class="c c-${suit}">${rank}${sym}</div>`;
}

function boardHtml(board) {
  return board.split(" ").map(cardHtml).join("");
}

function normalize(s) {
  return (s || "").toLowerCase().replace(/\s+/g, " ").trim();
}

function goalIsNamed(text) {
  const t = normalize(text);
  if (t.length < 8) return false;
  const keywords = ["колл", "фолд", "выбить", "заплат", "хуже", "лучше", "дро", "вэлью", "сфолд", "payload", "pay"];
  return keywords.some(k => t.includes(k));
}

function planIsNamed(text) {
  const t = normalize(text);
  if (t.length < 10) return false;
  const keywords = ["тёрн", "терн", "ривер", "флоп", "если", "чек", "бет", "фолд", "колл"];
  return keywords.some(k => t.includes(k));
}
/*CORE-END*/

let idx = 0, selected = null, answered = false;
const stats = { answered: 0, goal: 0, plan: 0 };

function render() {
  const app = document.getElementById("app");
  if (idx >= SPOTS.length) {
    app.innerHTML = `<div class="card"><h2 style="margin-top:0;">Прототип пройден</h2>
      <p>Решений: ${stats.answered} · цель названа: ${stats.goal} · план назван: ${stats.plan}</p>
      <p style="color:var(--muted); font-size:13px;">В полной версии: десятки спотов из твоих логов, разбивка по улицам и типам ошибок, счёт «ставок без цели» по сессиям, синхронизация с Хабом.</p></div>`;
    updateScore();
    return;
  }
  const s = SPOTS[idx];
  app.innerHTML = `
    <div class="card">
      <div class="rowline">
        <span>${s.pos} · стек $${s.stack.toFixed(2)} · банк $${s.pot.toFixed(2)}</span>
        <span class="tag">${s.street}</span>
      </div>
      <div class="board">${boardHtml(s.board)}</div>
      <div class="hole">Твоя рука: ${s.hole.split(" ").map(cardHtml).join("")}</div>
      <div class="hist">${s.hist}</div>

      <label>Что делаешь?</label>
      <div class="opts" id="opts">
        ${s.options.map(o => `<button class="opt" data-opt="${o}">${o}</button>`).join("")}
      </div>

      <label>Цель: кого хочешь увидеть в колле или в фолде?</label>
      <input type="text" id="goal" placeholder="например: колл от Ax, фолд от A-high">

      <label>План на следующую улицу</label>
      <input type="text" id="plan" placeholder="например: на рейз — фолд, на чек — бет 2/3">

      <div class="btns">
        <button class="primary" id="check">Проверить</button>
        <button class="plain" id="next">Дальше →</button>
      </div>
      <div class="verdict" id="verdict"></div>
    </div>
  `;
  document.getElementById("opts").addEventListener("click", e => {
    const b = e.target.closest(".opt");
    if (!b || answered) return;
    document.querySelectorAll(".opt").forEach(x => x.classList.remove("sel"));
    b.classList.add("sel");
    selected = b.dataset.opt;
  });
  document.getElementById("check").addEventListener("click", check);
  document.getElementById("next").addEventListener("click", () => { idx++; selected = null; answered = false; render(); });
  updateScore();
}

function check() {
  if (answered) return;
  const s = SPOTS[idx];
  const goal = document.getElementById("goal").value;
  const plan = document.getElementById("plan").value;
  const v = document.getElementById("verdict");

  const actOk = selected === s.correct;
  const gOk = goalIsNamed(goal);
  const pOk = planIsNamed(plan);

  answered = true;
  stats.answered++;
  if (gOk) stats.goal++;
  if (pOk) stats.plan++;

  v.innerHTML = `
    <div style="margin-bottom:10px;">
      <span class="${actOk ? 'ok' : 'no'}">${actOk ? '✅ действие верное' : '❌ действие: эталон — ' + s.correct}</span>
      <span style="color:var(--muted);"> · </span>
      <span class="${gOk ? 'ok' : 'mid'}">${gOk ? '✅ цель названа' : '⚠️ цель не названа'}</span>
      <span style="color:var(--muted);"> · </span>
      <span class="${pOk ? 'ok' : 'mid'}">${pOk ? '✅ план назван' : '⚠️ план не назван'}</span>
    </div>
    <div style="background:#0b1324; border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px;">
      <div style="margin-bottom:6px;"><b>Цель эталона:</b> ${s.goal}</div>
      <div><b>План эталона:</b> ${s.plan}</div>
    </div>
    <div style="color:#cbd5e1; font-size:13px;">${s.note}</div>
  `;
  updateScore();
}

function updateScore() {
  document.getElementById("score").textContent =
    `Счёт: ${stats.answered} решений, цель названа ${stats.goal} раз, план ${stats.plan} раз.`;
}

document.getElementById("restart").addEventListener("click", () => {
  idx = 0; selected = null; answered = false;
  stats.answered = stats.goal = stats.plan = 0;
  render();
});

render();
</script>
</body>
</html>
